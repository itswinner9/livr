project_id = "livrank"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "https://livrank.ca"
additional_redirect_urls = [
  "https://livrank.ca/**",
  "https://livrank.ca/auth/callback",
  "https://www.livrank.ca/**",
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
]

[auth.email]
enable_signup = true
enable_confirmations = false
